<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>VISTLabel system architecture</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#475569; stroke-width:1.4; }
      .grp { fill:#f8fafc; stroke:#94a3b8; stroke-width:1.2; stroke-dasharray:6 4; }
      .ui { fill:#eff6ff; stroke:#2563eb; stroke-width:1.4; }
      .api { fill:#f0fdf4; stroke:#16a34a; stroke-width:1.4; }
      .svc { fill:#fefce8; stroke:#ca8a04; stroke-width:1.4; }
      .job { fill:#fdf4ff; stroke:#a21caf; stroke-width:1.4; }
      .per { fill:#fff7ed; stroke:#ea580c; stroke-width:1.4; }
      .ext { fill:#f1f5f9; stroke:#64748b; stroke-width:1.4; }
      .h { font-size:15px; font-weight:600; fill:#0f172a; }
      .t { font-size:12.5px; fill:#1e293b; }
      .s { font-size:11.5px; fill:#475569; }
      .g { font-size:13px; font-weight:600; fill:#334155; }
      .ln { stroke:#475569; stroke-width:1.4; fill:none; marker-end:url(#arr); }
      .dl { stroke:#475569; stroke-width:1.2; fill:none; stroke-dasharray:4 3; marker-end:url(#arr); }
    </style>
  </defs>
  <rect width="1200" height="860" fill="#ffffff"/>
  <text x="600" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">VISTLabel 1.0.0 – system architecture</text>

  <!-- Browser -->
  <rect x="30" y="50" width="1140" height="110" rx="10" class="grp"/>
  <text x="45" y="70" class="g">Web browser (Chrome / Firefox) – no CDN assets, no runtime network access</text>
  <rect x="50" y="82" width="250" height="64" rx="6" class="ui"/>
  <text x="62" y="102" class="h">Server-rendered pages</text>
  <text x="62" y="120" class="t">Jinja2 templates: login, projects,</text>
  <text x="62" y="136" class="t">annotation workspace, help</text>
  <rect x="315" y="82" width="420" height="64" rx="6" class="ui"/>
  <text x="327" y="102" class="h">ES-module front end (static/js)</text>
  <text x="327" y="120" class="t">annotation-canvas.js (prompts, brush, undo, playback),</text>
  <text x="327" y="136" class="t">upload.js, exports.js, concept-search.js, workspace-panels.js</text>
  <rect x="750" y="82" width="400" height="64" rx="6" class="ui"/>
  <text x="762" y="102" class="h">HTTP contract</text>
  <text x="762" y="120" class="t">REST/JSON under /api/v1, masks as lossless PNG (base64),</text>
  <text x="762" y="136" class="t">cookie vistlabel_session + X-Requested-With: VISTLabel</text>

  <path d="M600,160 L600,196" class="ln"/>
  <text x="610" y="184" class="s">HTTP (localhost, SSH tunnel or TLS reverse proxy)</text>

  <!-- FastAPI -->
  <rect x="30" y="200" width="1140" height="160" rx="10" class="grp"/>
  <text x="45" y="220" class="g">FastAPI application – vistlabel.main.create_app() served by uvicorn (vistlabel serve)</text>
  <rect x="50" y="232" width="300" height="114" rx="6" class="api"/>
  <text x="62" y="252" class="h">auth.middleware.AuthMiddleware</text>
  <text x="62" y="272" class="t">session lookup (auth.sessions)</text>
  <text x="62" y="289" class="t">CSRF / same-origin check</text>
  <text x="62" y="306" class="t">401 for API, redirect /login or /setup</text>
  <text x="62" y="323" class="t">public: /login /setup /health /version</text>
  <text x="62" y="340" class="s">login rate limiter (per client)</text>
  <path d="M350,289 L372,289" class="ln"/>
  <rect x="375" y="232" width="775" height="114" rx="6" class="api"/>
  <text x="387" y="252" class="h">Routers (vistlabel.api)</text>
  <text x="387" y="273" class="t">pages · auth · projects · dataset_imports · frame_annotations · objects · segmentation</text>
  <text x="387" y="291" class="t">propagation (runs, jobs) · review_queue · auto_preannotate · exports · health · help</text>
  <text x="387" y="311" class="s">Request validation with Pydantic models; optimistic revisions (409 on conflict);</text>
  <text x="387" y="327" class="s">long work (propagation, auto pre-annotation, export) returns 202 + job id and runs in the JobManager</text>

  <path d="M330,360 L330,396" class="ln"/>
  <path d="M760,360 L760,396" class="ln"/>
  <path d="M1040,360 L1040,396" class="ln"/>

  <!-- Services -->
  <rect x="30" y="400" width="620" height="210" rx="10" class="grp"/>
  <text x="45" y="420" class="g">Domain services</text>
  <rect x="50" y="432" width="285" height="80" rx="6" class="svc"/>
  <text x="62" y="452" class="h">projects.store.ProjectStore</text>
  <text x="62" y="470" class="t">create (tmp dir + atomic rename),</text>
  <text x="62" y="486" class="t">list, update(revision), delete, labels,</text>
  <text x="62" y="502" class="t">startup recovery</text>
  <rect x="345" y="432" width="285" height="80" rx="6" class="svc"/>
  <text x="357" y="452" class="h">video.* (upload, validation, frames)</text>
  <text x="357" y="470" class="t">streaming upload, ffprobe check, one</text>
  <text x="357" y="486" class="t">re-encode, frame index, frame/thumbnail</text>
  <text x="357" y="502" class="t">JPEG cache</text>
  <rect x="50" y="520" width="285" height="78" rx="6" class="svc"/>
  <text x="62" y="540" class="h">annotations.* · tracking.manifests</text>
  <text x="62" y="558" class="t">frames, objects/classes (undo of delete),</text>
  <text x="62" y="574" class="t">occlusion + review reasons, PNG masks,</text>
  <text x="62" y="590" class="t">tracking-run manifests</text>
  <rect x="345" y="520" width="285" height="78" rx="6" class="svc"/>
  <text x="357" y="540" class="h">imports.* · exports.* · validation</text>
  <text x="357" y="558" class="t">COCO/YOLO ZIP import; frame selection,</text>
  <text x="357" y="574" class="t">splits, YOLO/COCO writers, polygons,</text>
  <text x="357" y="590" class="t">validation report, dataset.zip</text>

  <!-- Jobs + models -->
  <rect x="670" y="400" width="500" height="210" rx="10" class="grp"/>
  <text x="685" y="420" class="g">Background work and models</text>
  <rect x="690" y="432" width="460" height="62" rx="6" class="job"/>
  <text x="702" y="452" class="h">jobs.manager.JobManager</text>
  <text x="702" y="470" class="t">ThreadPoolExecutor (runtime.maximum_concurrent_gpu_jobs), cooperative</text>
  <text x="702" y="486" class="t">cancel/pause events, throttled progress, job records on disk</text>
  <path d="M920,494 L920,512" class="ln"/>
  <rect x="690" y="514" width="460" height="84" rx="6" class="job"/>
  <text x="702" y="534" class="h">segmentation.registry + sessions (LRU, max 4)</text>
  <text x="702" y="552" class="t">VideoSegmentationBackend protocol:</text>
  <text x="702" y="570" class="t">fake (always) · sam21 · sam3 · yolo_sam (YOLO + sam21/sam3 refiner)</text>
  <text x="702" y="588" class="s">unavailable backends report the exact reason, never substituted</text>

  <!-- persistence -->
  <path d="M340,610 L340,646" class="ln"/>
  <path d="M920,610 L920,646" class="ln"/>
  <rect x="30" y="650" width="1140" height="80" rx="10" class="per"/>
  <text x="45" y="672" class="h">Persistence layer (vistlabel.persistence)</text>
  <text x="45" y="692" class="t">atomic.py: temp file + fsync + os.replace (with Windows retries) · jsonl.py: append-only event logs · rle.py: COCO RLE codec (pycocotools)</text>
  <text x="45" y="710" class="t">migrations.py: schema_version per document kind · locks.py: advisory editor lock · paths.py: single source of the on-disk layout · safety.py: path containment</text>

  <path d="M340,730 L340,766" class="ln"/>
  <path d="M790,730 L790,766" class="dl"/>
  <text x="798" y="752" class="s">used by video.*, imports.*</text>
  <path d="M1048,730 L1048,766" class="dl"/>
  <text x="1056" y="752" class="s">used by backends</text>

  <!-- external -->
  <rect x="30" y="770" width="620" height="74" rx="8" class="ext"/>
  <text x="45" y="792" class="h">Workspace on the local filesystem (workspace.root)</text>
  <text x="45" y="811" class="t">auth/account.json, auth/sessions.json</text>
  <text x="45" y="828" class="t">projects/prj_&lt;ULID&gt;/ (video, frame cache, annotations, runs, jobs, exports)</text>
  <rect x="670" y="770" width="240" height="74" rx="8" class="ext"/>
  <text x="682" y="792" class="h">FFmpeg / ffprobe, PyAV</text>
  <text x="682" y="811" class="t">validation, re-encode,</text>
  <text x="682" y="828" class="t">decoding (external binaries)</text>
  <rect x="925" y="770" width="245" height="74" rx="8" class="ext"/>
  <text x="937" y="792" class="h">Optional GPU stack</text>
  <text x="937" y="811" class="t">PyTorch + CUDA, transformers,</text>
  <text x="937" y="828" class="t">ultralytics; checkpoints in models/</text>
</svg>
