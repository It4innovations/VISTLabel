[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vistlabel"
version = "1.0.0"
description = "Video Instance Segmentation, Tracking and Labeling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pycocotools>=2.0.7",
    "opencv-python-headless>=4.10",
    "av>=13.0",
    "pillow>=10.4",
    "python-multipart>=0.0.12",
    "jinja2>=3.1",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.5",
    "torchvision>=0.20",
    "transformers>=5.14",
    "huggingface_hub>=0.26",
    "accelerate>=1.0",
    "ultralytics>=8.3",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-playwright>=0.5",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "types-pycocotools",
]

[project.scripts]
vistlabel = "vistlabel.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/vistlabel"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
warn_unused_configs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "uvicorn.*",
    "torch.*",
    "torchvision.*",
    "transformers.*",
    "huggingface_hub.*",
    "ultralytics.*",
    "cv2.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = [
    "gpu: requires a real CUDA GPU and configured model checkpoints",
    "browser: requires Playwright browsers to be installed (playwright install)",
    "signed_out: browser test that starts without a session (sign-in flow tests)",
]
addopts = "-ra"
